spring.application.name=quick-start
server.port=8080

# ---- DeepSeek 模型配置 ----
# API Key 从环境变量 DEEPSEEK_API_KEY 读取（在 https://platform.deepseek.com 创建）
spring.ai.deepseek.api-key=${DEEPSEEK_API_KEY}
# 可选模型：deepseek-chat（对话）、deepseek-reasoner（推理）
spring.ai.deepseek.chat.options.model=deepseek-chat

# ---- 阿里云百炼（DashScope / Qwen）模型配置 ----
# API Key 从环境变量 DASHSCOPE_API_KEY 读取（百炼控制台 https://bailian.console.aliyun.com 创建）
# 留空时百炼自动装配会跳过，不影响 DeepSeek 功能
spring.ai.dashscope.api-key=${DASHSCOPE_API_KEY:}
spring.ai.dashscope.chat.options.model=qwen-plus
# 如需走代理，可配置 JVM 参数：-Dhttps.proxyHost=127.0.0.1 -Dhttps.proxyPort=7897
